# kirk CI/CD — Windows build on every push/PR, published release on version tags.
#
# Flow:
#   push to main / pull request -> build job compiles shim.dll + kirk.exe.
#   git tag v0.2.0 && git push origin v0.2.0 -> build job runs, then the
#   release job zips the staged runtime and publishes a GitHub Release.
#
# The vendored FFmpeg runtime (vendor/, gitignored) is fetched from the
# upstream full-shared build; scripts/build.ps1 stages it next to kirk.exe.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal + shards
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Cache shard libs
        uses: actions/cache@v4
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.yml') }}

      - name: Install shard dependencies
        run: shards install

      - name: Cache FFmpeg shared build
        id: ffmpeg-cache
        uses: actions/cache@v4
        # Bump the -vN suffix to pull a newer upstream FFmpeg.
        with:
          key: ${{ runner.os }}-ffmpeg-full-shared-v1
          path: vendor

      - name: Download FFmpeg shared build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor/dl | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP 'ffmpeg.7z'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z' -OutFile $tmp
          7z x $tmp -ovendor/dl | Out-Null
          Get-ChildItem vendor/dl -Directory -Filter 'ffmpeg-*' | Move-Item -Destination vendor/
          Remove-Item vendor/dl -Recurse -Force

      - name: Build shim.dll + kirk.exe
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Verify artifacts
        shell: pwsh
        run: |
          foreach ($f in @('build/kirk.exe', 'build/shim.dll', 'build/ffmpeg.exe')) {
            if (-not (Test-Path $f)) { throw "missing build artifact: $f" }
          }

      # The full staged runtime: exe, shim, ffmpeg and every DLL the build
      # placed next to them (Crystal runtime + FFmpeg shared libs).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kirk-windows-x64
          path: |
            build/kirk.exe
            build/shim.dll
            build/ffmpeg.exe
            build/*.dll
          if-no-files-found: error
          retention-days: 14

  msix:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download staged runtime
        uses: actions/download-artifact@v4
        with:
          name: kirk-windows-x64
          path: build

      # Unsigned pack on every run validates the manifest; tags additionally
      # get a self-signed package. Bringing your own cert: import a PFX and
      # pass -PfxPath/-PfxPassword with a matching -Publisher instead.
      - name: Pack MSIX (unsigned)
        shell: pwsh
        run: |
          $params = @{}
          if ('${{ github.ref_type }}' -eq 'tag') { $params['Version'] = '${{ github.ref_name }}'.TrimStart('v') + '.0' }
          ./scripts/build_msix.ps1 @params

      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@v4
        with:
          name: kirk-msix-unsigned
          path: dist/*.msix
          if-no-files-found: error
          retention-days: 14

      # Stable cert when the repo has MSIX_PFX_BASE64/MSIX_PFX_PASSWORD secrets
      # (one cert for all releases: users trust once), else an ephemeral
      # self-signed cert that changes every release. MSIX_PUBLISHER is only
      # needed when the PFX subject is not CN=kirk.
      - name: Sign MSIX (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        run: |
          $params = @{ Version = '${{ github.ref_name }}'.TrimStart('v') + '.0' }
          if ($env:MSIX_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'kirk-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
            $params['PfxPath'] = $pfx
            $params['PfxPassword'] = $env:MSIX_PFX_PASSWORD
            if ($env:MSIX_PUBLISHER) { $params['Publisher'] = $env:MSIX_PUBLISHER }
          } else {
            $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=kirk' -KeyUsage DigitalSignature -FriendlyName 'kirk MSIX (CI)' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')
            $params['SignThumbprint'] = $cert.Thumbprint
          }
          ./scripts/build_msix.ps1 @params

      - name: Upload signed MSIX + trust cert
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: kirk-msix-signed
          path: |
            dist/*.msix
            dist/*.cer
          if-no-files-found: error
          retention-days: 90

  release:
    needs: [build, msix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kirk-windows-x64
          path: pkg

      - name: Download signed MSIX
        uses: actions/download-artifact@v4
        with:
          name: kirk-msix-signed
          path: msix

      - name: Zip release
        shell: pwsh
        run: Compress-Archive -Path pkg/* -DestinationPath "kirk-${{ github.ref_name }}-windows-x64.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kirk-*.zip
            msix/*.msix
            msix/*.cer
          generate_release_notes: true
